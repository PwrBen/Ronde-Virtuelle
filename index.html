<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ronde de Sécurité - Inspection Extérieure</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="consignes">
        <h1>Ronde de sécurité : Inspection des abords</h1>
        <p>Inspectez le périmètre. Cliquez sur les anomalies pour déterminer l'action à mener.</p>
        <p>Anomalies traitées : <span id="score">0</span> / 3</p>
    </header>

    <main id="scene-ronde">
        <img src="site-securite.jpg" alt="Abords du site" id="image-fond">
        
        <!-- Zones d'anomalies (les pourcentages seront à ajuster selon l'image finale) -->
        <div class="anomalie" id="poubelle" data-id="poubelle" style="top: 60%; left: 20%; width: 10%; height: 20%;" title="Cliquer pour inspecter"></div>
        <div class="anomalie" id="issue" data-id="issue" style="top: 40%; left: 50%; width: 12%; height: 35%;" title="Cliquer pour inspecter"></div>
        <div class="anomalie" id="grillage" data-id="grillage" style="top: 50%; left: 80%; width: 15%; height: 25%;" title="Cliquer pour inspecter"></div>
    </main>

    <!-- Fenêtre Modale pour le QCM -->
    <div id="qcm-modal" class="modal cache">
        <div class="modal-contenu">
            <h2 id="qcm-titre">Question</h2>
            <div id="qcm-options" class="options-container">
                <!-- Les boutons seront générés en JS -->
            </div>
            <p id="qcm-feedback" class="feedback cache"></p>
            <button id="btn-fermer" class="cache">Fermer et continuer</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
