<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ronde de Sécurité - Inspection Extérieure</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="consignes">
        <h1>Ronde de sécurité : Inspection des abords</h1>
        <p>Inspectez le périmètre. Cliquez sur les anomalies pour formuler votre constat.</p>
        <p>Anomalies traitées : <span id="score">0</span> / 3</p>
        <button id="btn-toggle-zones">Afficher/Masquer les zones d'aide</button>
    </header>

    <main id="scene-ronde">
        <img src="site-securite.jpg" alt="Abords du site" id="image-fond">
        
        <!-- BLOC 1 : Issue de secours mal verrouillée -->
        <div class="anomalie" id="bloc1" data-id="bloc1" style="top: 40%; left: 65%; width: 12%; height: 35%;" title="Cliquer pour inspecter"></div>
        
        <!-- BLOC 2 : Grillage découpé -->
        <div class="anomalie" id="bloc2" data-id="bloc2" style="top: 45%; left: 16%; width: 15%; height: 25%;" title="Cliquer pour inspecter"></div>
        
        <!-- BLOC 3 : Poubelle sous la fenêtre -->
        <div class="anomalie" id="bloc3" data-id="bloc3" style="top: 50%; left: 41%; width: 15%; height: 25%;" title="Cliquer pour inspecter"></div>
    </main>

    <!-- Fenêtre Modale pour le QCM double -->
    <div id="qcm-modal" class="modal cache">
        <div class="modal-contenu double-colonne-layout">
            <span id="fermer-croix" title="Fermer la fenêtre">&times;</span>
            <h2 id="qcm-titre">Analyse de la situation</h2>
            
            <div class="grille-qcm">
                <!-- Colonne 1 : Le Constat -->
                <div class="colonne-qcm">
                    <h3>1. Identification (Constat factuel)</h3>
                    <div id="options-id" class="options-container"></div>
                </div>
                
                <!-- Colonne 2 : L'Analyse -->
                <div class="colonne-qcm">
                    <h3>2. Justification (Évaluation du risque)</h3>
                    <div id="options-justif" class="options-container"></div>
                </div>
            </div>

            <div class="actions-modal">
                <button id="btn-valider-analyse" class="cache" disabled>Valider mon analyse</button>
                <p id="qcm-feedback" class="feedback cache"></p>
                <button id="btn-fermer" class="cache">Continuer la ronde</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
